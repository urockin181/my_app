name: my_app
description: "Muslim Guide (دليل المسلم) - Quran & Hadith chatbot, prayer times, Qibla, and Athkar."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Networking
  http: ^1.2.2

  # Localization / formatting
  intl: any

  # Local persistence (language choice, athkar counters, chat history)
  shared_preferences: ^2.3.3

  # Location (prayer times + qibla)
  geolocator: ^13.0.2
  permission_handler: ^11.3.1

  # Prayer time calculation (local, no API needed)
  adhan_dart: ^2.0.1

  # Compass sensor for Qibla direction
  flutter_qiblah: ^3.0.0

  # Gemini free-tier LLM for the chatbot's natural language layer
  google_generative_ai: ^0.4.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
